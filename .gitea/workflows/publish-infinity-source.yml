name: Publish Infinity+ source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: gitea.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITEA_TOKEN }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools platforms;android-33 platforms;android-34 platforms;android-35 platforms;android-36 build-tools;36.0.0'
      - name: Cache locally built Morphe dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/infinity-plus-deps
          key: morphe-source-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ci/**', 'gradle/libs.versions.toml', 'settings.gradle.kts') }}

      - name: Read release version
        shell: bash
        run: |
          VERSION=$(sed -nE 's/^[[:space:]]*version[[:space:]]*=[[:space:]]*([^[:space:]#]+).*/\1/p' gradle.properties | head -n 1)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Expected semantic version in gradle.properties"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build Morphe patch bundle without GitHub credentials
        run: bash ci/build.sh

      - name: Stage release asset
        shell: bash
        run: |
          mkdir -p dist
          mapfile -t bundles < <(find patches/build/libs -maxdepth 1 -type f -name '*.mpp' ! -name '*sources*' ! -name '*javadoc*')
          if (( ${#bundles[@]} != 1 )); then
            echo "Expected exactly one .mpp bundle; found ${#bundles[@]}"
            printf '%s\n' "${bundles[@]}"
            exit 1
          fi
          cp "${bundles[0]}" "dist/patches-${VERSION}.mpp"

      - name: Publish Gitea release and generate source metadata
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GITEA_SERVER_URL: ${{ gitea.server_url }}
          GITEA_REPOSITORY: ${{ gitea.repository }}
          GITEA_SHA: ${{ gitea.sha }}
        run: python3 ci/publish_gitea.py

      - name: Commit source metadata
        shell: bash
        run: |
          git config user.name 'gitea-actions[bot]'
          git config user.email 'gitea-actions@noreply.local'
          git add patches-bundle.json
          if git diff --cached --quiet; then
            echo 'Source metadata is already current.'
          else
            git commit -m "chore: publish Morphe source v${VERSION} [skip ci]"
            git push origin HEAD:main
          fi
