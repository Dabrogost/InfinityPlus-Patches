name: Publish Infinity+ source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools platforms;android-33 platforms;android-34 platforms;android-35 platforms;android-36 build-tools;36.0.0'
      - name: Cache locally built Morphe dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/infinity-plus-deps
          key: morphe-source-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ci/**', 'gradle/libs.versions.toml', 'settings.gradle.kts') }}

      - name: Read release version
        shell: bash
        run: |
          VERSION=$(sed -nE 's/^[[:space:]]*version[[:space:]]*=[[:space:]]*([^[:space:]#]+).*/\1/p' gradle.properties | head -n 1)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Expected semantic version in gradle.properties"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build Morphe patch bundle without GitHub credentials
        run: bash ci/build.sh

      - name: Stage release asset
        shell: bash
        run: |
          mkdir -p dist
          mapfile -t bundles < <(find patches/build/libs -maxdepth 1 -type f -name '*.mpp' ! -name '*sources*' ! -name '*javadoc*')
          if (( ${#bundles[@]} != 1 )); then
            echo "Expected exactly one .mpp bundle; found ${#bundles[@]}"
            printf '%s\n' "${bundles[@]}"
            exit 1
          fi
          cp "${bundles[0]}" "dist/patches-${VERSION}.mpp"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create "v${VERSION}" "dist/patches-${VERSION}.mpp" \
            --title "Infinity+ Patches v${VERSION}" \
            --notes "Infinity+ Morphe compatibility patches. Includes code adapted from Patcheddit."

      - name: Update Morphe source metadata
        shell: bash
        run: |
          python3 - <<'PY_META'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          version = os.environ['VERSION']
          repo = os.environ['GITHUB_REPOSITORY']
          metadata = {
              'created_at': datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%S'),
              'description': f'Infinity+ Morphe patches v{version}. Based on Patcheddit; see NOTICE.',
              'download_url': f'https://github.com/{repo}/releases/download/v{version}/patches-{version}.mpp',
              'signature_download_url': '',
              'version': version,
          }
          Path('patches-bundle.json').write_text(json.dumps(metadata, indent=2) + '\n', encoding='utf-8')
          PY_META
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add patches-bundle.json
          git commit -m "chore: publish Morphe source v${VERSION} [skip ci]"
          git push origin HEAD:main
